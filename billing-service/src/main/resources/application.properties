#server
spring.application.name=billing-service
server.port=8082
#oracle db
spring.datasource.url=jdbc:oracle:thin:@oracle-xe:1521/ORCLPDB
spring.datasource.username=billingService
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
##kafka
spring.kafka.bootstrap-servers=kafka:9092
#keycloak
keycloak.realm=saas
keycloak.port=8080
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:${keycloak.port}/realms/${keycloak.realm}
jwt.auth.converter.principle-attribute=preferred_username
jwt.auth.converter.resource-id=saas-auth