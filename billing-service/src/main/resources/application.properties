# Defaults are for running on your machine; docker-compose overrides them with env vars.
spring.application.name=billing-service
server.port=8082

# Oracle
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/ORCLPDB}
spring.datasource.username=${DB_USERNAME:billingService}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.open-in-view=false

# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Kafka: consumes usage events from rag-service
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:29092}
# Usage is money: after a restart, bill everything that arrived while we were down.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.common.events
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.common.events.UsageEvent

# Security (Keycloak): issuer = public URL inside tokens, keys fetched from the internal URL
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/saas}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/saas/protocol/openid-connect/certs}
jwt.auth.converter.principle-attribute=preferred_username
jwt.auth.converter.resource-id=saas-auth

# Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1.0
