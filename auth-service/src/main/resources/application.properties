# Defaults are for running on your machine; docker-compose overrides them with env vars.
spring.application.name=auth-service
server.port=8081
spring.profiles.active=${SPRING_PROFILES_ACTIVE:PRODUCTION}

# Oracle
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/ORCLPDB}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false

# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Keycloak
keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:saas}
keycloak.client.uuid=${KEYCLOAK_CLIENT_UUID:f8c92b7b-eb3b-48c8-beb4-56021643e88e}

# Incoming JWTs: issuer = Keycloak's public URL (what's inside tokens), keys fetched from the internal URL.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/saas}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${keycloak.base-url}/realms/${keycloak.realm}/protocol/openid-connect/certs}
jwt.auth.converter.principle-attribute=preferred_username
jwt.auth.converter.resource-id=saas-auth

# Outgoing calls to the Keycloak Admin API: client-credentials token, cached and refreshed by Spring
spring.security.oauth2.client.registration.keycloak-admin.provider=keycloak
spring.security.oauth2.client.registration.keycloak-admin.client-id=saas-auth
spring.security.oauth2.client.registration.keycloak-admin.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak-admin.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=${keycloak.base-url}/realms/${keycloak.realm}/protocol/openid-connect/token

# Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1.0
