#server
spring.application.name=auth-service
server.port=8081
spring.profiles.active=PRODUCTION
#oracle db
spring.datasource.url=jdbc:oracle:thin:@oracle-xe:1521/ORCLPDB
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
#keyclock
keycloak.realm=saas
keycloak.port=8080
keycloak.client.uuid=f8c92b7b-eb3b-48c8-beb4-56021643e88e
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:${keycloak.port}/realms/${keycloak.realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
jwt.auth.converter.principle-attribute=preferred_username
jwt.auth.converter.resource-id=saas-auth
jwt.auth.client_secret=${KEYCLOAK_CLIENT_SECRET}
##kafka
spring.kafka.bootstrap-servers=kafka:9092


