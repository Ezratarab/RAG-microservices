services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.1
    container_name: keycloak
    ports:
      - "8080:8080"
    environment:
      KC_ADMIN: admin
      KC_ADMIN_PASSWORD: admin

      KC_DB: oracle
      KC_DB_URL_HOST: oracle-xe
      KC_DB_URL_PORT: 1521
      KC_DB_URL_DATABASE: ORCLPDB
      KC_DB_USERNAME: keycloakService
      KC_DB_PASSWORD: Keycloak123

      TZ: Asia/Jerusalem

    volumes:
      - ./oracle-drivers:/opt/keycloak/providers

    command: start-dev --spi-jdbc-driver-dir=/opt/keycloak/providers

    networks:
      - keycloak-net

networks:
  keycloak-net:
    external: true
