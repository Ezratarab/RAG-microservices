server:
  port: 8000

spring:
  application:
    name: gateway-service

  # Redis holds the rate-limit token buckets, shared by all gateway instances.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer = Keycloak's public URL (inside tokens); keys fetched from the internal URL
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/saas}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/saas/protocol/openid-connect/certs}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-signup
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth
                - Method=POST
              filters:
                # Public endpoint: limit sign-ups per IP (1/s, bursts of 5)
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 5
                    key-resolver: "#{@ipKeyResolver}"

            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**

            - id: billing
              uri: ${BILLING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/billing/**

            - id: rag
              uri: ${RAG_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/rag/**
              filters:
                # LLM calls are expensive. 1 token/s refill, 3 tokens per request
                # = 20 requests/minute per user, with bursts of up to 10 requests (30 tokens).
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 30
                    redis-rate-limiter.requestedTokens: 3
                    key-resolver: "#{@userKeyResolver}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
