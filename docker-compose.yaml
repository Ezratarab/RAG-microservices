version: "3.9"

services:

  # =========================
  # ORACLE
  # =========================

  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe

    restart: unless-stopped

    ports:
      - "1521:1521"

    environment:
      ORACLE_PASSWORD: oracle
      ORACLE_DATABASE: ORCLPDB
      TZ: Asia/Jerusalem

    volumes:
      - oracle_data:/opt/oracle/oradata

    healthcheck:
      test: [ "CMD-SHELL", "echo 'SELECT 1 FROM dual;' | sqlplus -s system/oracle@localhost:1521/ORCLPDB || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10

    networks:
      - saas-network

  # =========================
  # KEYCLOAK
  # =========================

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.1
    container_name: keycloak

    restart: unless-stopped

    depends_on:
      oracle-xe:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_DB: oracle
      KC_DB_URL_HOST: oracle-xe
      KC_DB_URL_PORT: 1521
      KC_DB_URL_DATABASE: ORCLPDB

      KC_DB_USERNAME: keycloakService
      KC_DB_PASSWORD: Keycloak123

      TZ: Asia/Jerusalem

    command:
      - start-dev
      - --spi-jdbc-driver-dir=/opt/keycloak/providers

    volumes:
      - ./oracle-drivers:/opt/keycloak/providers

    networks:
      - saas-network

  # =========================
  # REDIS STACK
  # =========================

  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack

    restart: unless-stopped

    ports:
      - "6379:6379"
      - "8001:8001"

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - saas-network

  # =========================
  # OLLAMA
  # =========================

  ollama:
    image: ollama/ollama:latest
    container_name: ollama

    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_storage:/root/.ollama

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434/api/tags" ]
      interval: 15s
      timeout: 5s
      retries: 20

    networks:
      - saas-network

  # =========================
  # OLLAMA MODEL PULLER
  # =========================

  ollama-puller:
    image: curlimages/curl:latest
    container_name: ollama-puller

    depends_on:
      ollama:
        condition: service_healthy

    entrypoint: [ "/bin/sh", "-c" ]

    command: >
      "
      echo 'Pulling llama3.2 model...';
      curl -X POST http://ollama:11434/api/pull
      -H 'Content-Type: application/json'
      -d '{\"name\":\"llama3.2\"}';

      echo 'Pulling nomic-embed-text model...';
      curl -X POST http://ollama:11434/api/pull
      -H 'Content-Type: application/json'
      -d '{\"name\":\"nomic-embed-text\"}';

      echo 'Models downloaded successfully';
      "

    restart: "no"

    networks:
      - saas-network

  # =========================
  # KAFKA
  # =========================

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka

    ports:
      - "29092:29092"   # external (from host)
      - "9092:9092"     # internal (for docker network)

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # listeners (internal + external + controller)
      KAFKA_LISTENERS: >
        PLAINTEXT_INTERNAL://:9092,
        PLAINTEXT_EXTERNAL://:29092,
        CONTROLLER://:9093

      # how clients connect
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT_INTERNAL://kafka:9092,
        PLAINTEXT_EXTERNAL://localhost:29092

      # protocol mapping
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT_INTERNAL:PLAINTEXT,
        PLAINTEXT_EXTERNAL:PLAINTEXT

      # inter-broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      # controller quorum (KRaft mode)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # storage
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      # cluster id (required for KRaft)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    healthcheck:
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092" ]
      interval: 15s
      timeout: 10s
      retries: 10

    networks:
      - saas-network


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui

    ports:
      - "8084:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      - kafka

    networks:
      - saas-network

  # =========================
  # AUTH SERVICE
  # =========================

  auth-service:
    build:
      context: ./auth-service

    container_name: auth-service

    restart: unless-stopped

    depends_on:
      oracle-xe:
        condition: service_healthy

      keycloak:
        condition: service_started

    ports:
      - "8081:8081"

    environment:
      SPRING_PROFILES_ACTIVE: PRODUCTION

      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-xe:1521/ORCLPDB
      SPRING_DATASOURCE_USERNAME: authService
      SPRING_DATASOURCE_PASSWORD: Auth123

      KEYCLOAK_REALM: saas
      KEYCLOAK_PORT: 8080

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: >
        http://keycloak:8080/realms/saas

    networks:
      - saas-network

  # =========================
  # RAG SERVICE
  # =========================

  rag-service:
    build:
      context: ./rag-service

    container_name: rag-service

    restart: unless-stopped

    depends_on:
      redis-stack:
        condition: service_healthy

      kafka:
        condition: service_healthy

      ollama:
        condition: service_healthy

    ports:
      - "8082:8082"

    environment:
      SPRING_PROFILES_ACTIVE: PRODUCTION

      SPRING_DATA_REDIS_HOST: redis-stack
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434

    networks:
      - saas-network

# =========================
# NETWORKS
# =========================

networks:
  saas-network:
    driver: bridge

# =========================
# VOLUMES
# =========================

volumes:
  oracle_data:
  redis_data:
  ollama_storage: