server.port=8083
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB
spring.data.redis.jedis.pool.max-active=25
spring.data.redis.jedis.pool.timeout=2000
spring.application.name=rag-service
spring.ai.ollama.base-url=http://ollama:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.ollama.embedding.options.temperature=1.0
#OllamaChatOptions
spring.ai.model.chat=ollama
spring.ai.ollama.chat.model=llama3.1:latest
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.num-ctx=4096
spring.ai.ollama.chat.options.num-predict=600
#kafka
spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.consumer.group-id=rag-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.rag_service.Events
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.rag_service.Events.QueryEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.trusted.packages=com.example.rag_service.Events
#keycloak
keycloak.realm=saas
keycloak.port=8080
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:${keycloak.port}/realms/${keycloak.realm}
jwt.auth.converter.principle-attribute=preferred_username
jwt.auth.converter.resource-id=saas-auth
