# Defaults are for running on your machine; docker-compose overrides them with env vars.
spring.application.name=rag-service
server.port=8083

# Uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB

# Redis (vector store, keyword index, document records)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

# Ollama
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${CHAT_MODEL:llama3.2}
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.num-ctx=4096
spring.ai.ollama.chat.options.num-predict=600
spring.ai.ollama.embedding.options.model=${EMBEDDING_MODEL:nomic-embed-text}

# Kafka: used only for background work (ingestion jobs, usage events), not for answering questions
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:29092}
# Ingestion jobs are durable work: after a restart, process anything that was missed.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.common.events
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.common.events.IngestRequested
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Security (Keycloak): issuer = public URL inside tokens, keys fetched from the internal URL
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/saas}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/saas/protocol/openid-connect/certs}
jwt.auth.converter.principle-attribute=preferred_username
jwt.auth.converter.resource-id=saas-auth

# RAG tuning (validated at startup by RagProperties)
rag.index-name=rag-index
rag.top-k=50
rag.context-chunks=5
rag.search-timeout=5s
rag.answer-idle-timeout=90s
rag.storage-dir=${RAG_STORAGE_DIR:./data/uploads}
rag.chunk-size=1200
rag.chunk-overlap=150
rag.redis-max-connections=25

# Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1.0
