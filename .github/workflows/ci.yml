name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Builds every module (common, services, gateway) and runs the unit tests.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Docker images build
        run: |
          for s in auth-service billing-service rag-service gateway-service; do
            docker build --build-arg SERVICE=$s -t $s:ci .
          done
